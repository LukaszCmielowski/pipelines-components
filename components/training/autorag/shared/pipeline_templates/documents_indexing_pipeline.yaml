# PIPELINE DEFINITION
# Name: autorag-documents-indexing-pipeline
# Description: AutoRAG pipeline for preparing a high-quality knowledge base for accurate RAG retrieval. It transforms unstructured documents into optimized vector indexes for semantic search and downstream RAG workflows. Delivers production-grade embeddings, flexible indexing controls, and a reliable foundation for scalable RAG applications.
# Inputs:
#    batch_size: int [Default: 20.0]
#    chunk_overlap: int [Default: 0.0]
#    chunk_size: int [Default: 1024.0]
#    chunking_method: str [Default: 'recursive']
#    collection_name: str
#    distance_metric: str [Default: 'cosine']
#    embedding_model_id: str
#    embedding_params: dict
#    input_data_bucket_name: str
#    input_data_key: str
#    input_data_secret_name: str
#    ogx_secret_name: str
#    pattern_name: str
#    vector_io_provider_id: str
#    vector_store_type: str
components:
  comp-documents-discovery:
    executorLabel: exec-documents-discovery
    inputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Optional input artifact containing test data for sampling.
          isOptional: true
      parameters:
        input_data_bucket_name:
          description: S3 (or compatible) bucket containing input data.
          parameterType: STRING
        input_data_path:
          defaultValue: ''
          description: Path to folder with input documents within the bucket.
          isOptional: true
          parameterType: STRING
        sampling_enabled:
          defaultValue: true
          description: Whether to enable sampling or not.
          isOptional: true
          parameterType: BOOLEAN
        sampling_max_size:
          defaultValue: 1.0
          description: Maximum size of sampled documents (in gigabytes).
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        discovered_documents:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-documents-indexing:
    executorLabel: exec-documents-indexing
    inputDefinitions:
      artifacts:
        extracted_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Input artifact (folder) containing .md files from text extraction.
      parameters:
        batch_size:
          defaultValue: 20.0
          description: Number of documents per batch; 0 means process all in one batch.
          isOptional: true
          parameterType: NUMBER_INTEGER
        chunk_overlap:
          defaultValue: 0.0
          description: Chunk overlap in characters.
          isOptional: true
          parameterType: NUMBER_INTEGER
        chunk_size:
          defaultValue: 1024.0
          description: Chunk size in characters.
          isOptional: true
          parameterType: NUMBER_INTEGER
        chunking_method:
          defaultValue: recursive
          description: Chunking method.
          isOptional: true
          parameterType: STRING
        collection_name:
          description: Optional name of the collection to reuse; omit to create a
            new one.
          isOptional: true
          parameterType: STRING
        distance_metric:
          defaultValue: cosine
          description: Vector distance metric (e.g. "cosine").
          isOptional: true
          parameterType: STRING
        embedding_model_id:
          description: Embedding model ID used for the vector store.
          parameterType: STRING
        embedding_params:
          description: Optional embedding parameters.
          isOptional: true
          parameterType: STRUCT
        pattern_name:
          description: Optional RAG pattern identifier for run metadata.
          isOptional: true
          parameterType: STRING
        vector_io_provider_id:
          description: OGX provider ID for the vector database.
          parameterType: STRING
        vector_store_type:
          description: Optional vector store provider type (e.g. milvus) for statistics.
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        indexing_stats:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-text-extraction:
    executorLabel: exec-text-extraction
    inputDefinitions:
      artifacts:
        documents_descriptor:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact containing

            documents_descriptor.json with bucket, prefix, and documents list.'
      parameters:
        error_tolerance:
          description: "Fraction of documents (0.0\u20131.0) allowed to fail without\n\
            raising an error. None (the default) means zero tolerance \u2014 any failure\n\
            raises immediately after all documents are processed. 0.1 means up to\n\
            10 % of documents may fail. Exceeding the threshold raises RuntimeError\n\
            with a summary of up to 10 failing documents."
          isOptional: true
          parameterType: NUMBER_DOUBLE
        max_extraction_workers:
          description: 'Number of parallel worker processes used for text

            extraction. Each worker loads a full docling DocumentConverter into memory

            (ONNX models, layout detection, etc.), so this should be kept low to avoid

            out-of-memory issues. Defaults to 4. Set to None to use all available
            CPU

            cores. Set to 1 to disable parallelism.'
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        extracted_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-documents-discovery:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - documents_discovery
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n__KFP_EMBEDDED_ASSET_FILE = __kfp_os.path.join(__KFP_EMBEDDED_ASSET_DIR,\
          \ 'component_status.py')\n\n\n\n\ndef documents_discovery(\n    input_data_bucket_name:\
          \ str,\n    component_status: dsl.Output[dsl.Artifact],\n    input_data_path:\
          \ str = \"\",\n    test_data: dsl.Input[dsl.Artifact] = None,\n    sampling_enabled:\
          \ bool = True,\n    sampling_max_size: float = 1,\n    discovered_documents:\
          \ dsl.Output[dsl.Artifact] = None,\n    embedded_artifact: dsl.EmbeddedInput[dsl.Dataset]\
          \ = None,\n):\n    \"\"\"Documents discovery component.\n\n    Lists available\
          \ documents from S3, performs sampling if applied and writes a JSON manifest\n\
          \    (documents_descriptor.json) with metadata. Does not download document\
          \ contents.\n\n    Args:\n        input_data_bucket_name: S3 (or compatible)\
          \ bucket containing input data.\n        input_data_path: Path to folder\
          \ with input documents within the bucket.\n        test_data: Optional input\
          \ artifact containing test data for sampling.\n        sampling_enabled:\
          \ Whether to enable sampling or not.\n        sampling_max_size: Maximum\
          \ size of sampled documents (in gigabytes).\n        discovered_documents:\
          \ Output artifact containing the documents descriptor JSON file.\n     \
          \   component_status: Output artifact containing stage-level progress tracking.\n\
          \        embedded_artifact: Embedded ``autorag.shared`` helpers injected\
          \ by KFP at runtime.\n\n    Environment variables (required when run with\
          \ pipeline secret injection):\n        AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,\
          \ AWS_S3_ENDPOINT.\n        AWS_DEFAULT_REGION is optional.\n    \"\"\"\n\
          \    import json\n    import logging\n    import os\n    import sys\n  \
          \  from math import inf\n    from pathlib import Path\n\n    import boto3\n\
          \n    logger = logging.getLogger(\"Document Loader component logger\")\n\
          \    logger.setLevel(logging.INFO)\n    handler = logging.StreamHandler(sys.stdout)\n\
          \    logger.addHandler(handler)\n\n    DOCUMENTS_DESCRIPTOR_FILENAME = \"\
          documents_descriptor.json\"\n    SUPPORTED_EXTENSIONS = {\".pdf\", \".docx\"\
          , \".pptx\", \".md\", \".html\", \".txt\"}\n    MAX_SIZE_BYTES = float(inf)\n\
          \n    if sampling_enabled:\n        MAX_SIZE_BYTES = float(sampling_max_size)\
          \ * 1024**3\n\n    def get_test_data_docs_names() -> list[str]:\n      \
          \  if test_data is None:\n            return []\n        with open(test_data.path,\
          \ \"r\") as f:\n            benchmark = json.load(f)\n\n        docs_names\
          \ = []\n        for question in benchmark:\n            docs_names.extend(question[\"\
          correct_answer_document_ids\"])\n\n        return docs_names\n\n    import\
          \ importlib.util\n\n    from botocore.exceptions import SSLError\n\n   \
          \ _embedded_path = Path(embedded_artifact.path)\n    _module_path = _embedded_path\
          \ if _embedded_path.is_file() else _embedded_path / \"component_status.py\"\
          \n    _spec = importlib.util.spec_from_file_location(\"_autorag_component_status\"\
          , _module_path)\n    if _spec is None or _spec.loader is None:\n       \
          \ raise ValueError(f\"Cannot load embedded module from {_module_path}\"\
          )\n    _status_module = importlib.util.module_from_spec(_spec)\n    _spec.loader.exec_module(_status_module)\n\
          \    status = _status_module.bootstrap_status_tracker(embedded_artifact,\
          \ component_status, \"documents_discovery\")\n    with status:\n       \
          \ status.set_metadata(display_name=\"Documents Discovery Status\")\n   \
          \     component_status.metadata[\"display_name\"] = \"Documents Discovery\
          \ Status\"\n        with status.stage(\"discover_documents\"):\n       \
          \     s3_creds = {k: os.environ.get(k) for k in [\"AWS_ACCESS_KEY_ID\",\
          \ \"AWS_SECRET_ACCESS_KEY\", \"AWS_S3_ENDPOINT\"]}\n            for k, v\
          \ in s3_creds.items():\n                if v is None:\n                \
          \    raise ValueError(\n                        \"%s environment variable\
          \ not set. Check if kubernetes secret was configured properly\" % k\n  \
          \                  )\n            s3_creds[\"AWS_DEFAULT_REGION\"] = os.environ.get(\"\
          AWS_DEFAULT_REGION\")\n\n            def _make_s3_client(verify=True):\n\
          \                return boto3.client(\n                    \"s3\",\n   \
          \                 endpoint_url=s3_creds[\"AWS_S3_ENDPOINT\"],\n        \
          \            region_name=s3_creds[\"AWS_DEFAULT_REGION\"],\n           \
          \         aws_access_key_id=s3_creds[\"AWS_ACCESS_KEY_ID\"],\n         \
          \           aws_secret_access_key=s3_creds[\"AWS_SECRET_ACCESS_KEY\"],\n\
          \                    verify=verify,\n                )\n\n            #\
          \ Use paginator to handle buckets with >1,000 objects\n            def _list_all_objects(s3_client):\n\
          \                \"\"\"List all objects under prefix using pagination.\"\
          \"\"\n                paginator = s3_client.get_paginator(\"list_objects_v2\"\
          )\n                contents = []\n                for page in paginator.paginate(\n\
          \                    Bucket=input_data_bucket_name,\n                  \
          \  Prefix=input_data_path,\n                ):\n                    contents.extend(page.get(\"\
          Contents\", []))\n                return contents\n\n            try:\n\
          \                s3_client = _make_s3_client()\n                contents\
          \ = _list_all_objects(s3_client)\n            except SSLError:\n       \
          \         logger.warning(\n                    \"SSL error when listing\
          \ objects in s3://%s/%s, retrying with verify=False\",\n               \
          \     input_data_bucket_name,\n                    input_data_path,\n  \
          \              )\n                s3_client = _make_s3_client(verify=False)\n\
          \                contents = _list_all_objects(s3_client)\n\n           \
          \ logger.info(\n                \"S3_DISCOVERY bucket=%s prefix=%s total_objects=%d\"\
          ,\n                input_data_bucket_name,\n                input_data_path,\n\
          \                len(contents),\n            )\n\n            supported_files\
          \ = [c for c in contents if c[\"Key\"].endswith(tuple(SUPPORTED_EXTENSIONS))]\n\
          \            if not supported_files:\n                raise Exception(\"\
          No supported documents found.\")\n\n            test_data_docs_names = get_test_data_docs_names()\n\
          \            if test_data_docs_names:\n                test_keys_set = {c[\"\
          Key\"] for c in supported_files if Path(c[\"Key\"]).name in test_data_docs_names}\n\
          \                supported_files.sort(key=lambda c: c[\"Key\"] not in test_keys_set)\n\
          \n            total_size = 0\n            selected = []\n            for\
          \ file in supported_files:\n                if total_size + file[\"Size\"\
          ] > MAX_SIZE_BYTES:\n                    continue\n                selected.append(file)\n\
          \                total_size += file[\"Size\"]\n\n            documents =\
          \ []\n            for file_info in selected:\n                key = file_info[\"\
          Key\"]\n                size_bytes = file_info[\"Size\"]\n             \
          \   documents.append(\n                    {\n                        \"\
          key\": key,\n                        \"size_bytes\": size_bytes,\n     \
          \               }\n                )\n            if not documents:\n  \
          \              raise ValueError(\n                    \"No documents to\
          \ process. Check that the bucket/prefix is correct and contains supported\
          \ files.\"\n                )\n\n            descriptor = {\n          \
          \      \"bucket\": input_data_bucket_name,\n                \"prefix\":\
          \ input_data_path,\n                \"documents\": documents,\n        \
          \        \"total_size_bytes\": total_size,\n                \"count\": len(documents),\n\
          \            }\n\n            logger.info(\n                \"DISCOVERY_COMPLETE\
          \ bucket=%s prefix=%s document_count=%d total_size_bytes=%d sampling=%s\"\
          ,\n                input_data_bucket_name,\n                input_data_path,\n\
          \                len(documents),\n                total_size,\n        \
          \        f\"enabled_max={sampling_max_size}GB\" if sampling_enabled else\
          \ \"disabled\",\n            )\n\n            os.makedirs(discovered_documents.path,\
          \ exist_ok=True)\n            descriptor_path = os.path.join(discovered_documents.path,\
          \ DOCUMENTS_DESCRIPTOR_FILENAME)\n            with open(descriptor_path,\
          \ \"w\") as f:\n                json.dump(descriptor, f, indent=2)\n\n \
          \           logger.info(\"Documents descriptor written to %s\", descriptor_path)\n\
          \n"
        image: quay.io/opendatahub/odh-autorag:odh-stable
    exec-documents-indexing:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - documents_indexing
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef documents_indexing(\n    embedding_model_id: str,\n    extracted_text:\
          \ dsl.Input[dsl.Artifact],\n    vector_io_provider_id: str,\n    indexing_stats:\
          \ dsl.Output[dsl.Artifact],\n    embedding_params: Optional[dict] = None,\n\
          \    distance_metric: str = \"cosine\",\n    chunking_method: str = \"recursive\"\
          ,\n    chunk_size: int = 1024,\n    chunk_overlap: int = 0,\n    batch_size:\
          \ int = 20,\n    collection_name: Optional[str] = None,\n    pattern_name:\
          \ Optional[str] = None,\n    vector_store_type: Optional[str] = None,\n\
          ):\n    \"\"\"Index extracted text into a vector store with optional batch\
          \ processing.\n\n    Reads markdown files from extracted_text, chunks them,\
          \ embeds via OGX,\n    and adds them to the vector store. When batch_size\
          \ > 0, processes documents\n    in batches to limit memory use and allow\
          \ progress on large inputs.\n\n    Args:\n        embedding_model_id: Embedding\
          \ model ID used for the vector store.\n        extracted_text: Input artifact\
          \ (folder) containing .md files from text extraction.\n        vector_io_provider_id:\
          \ OGX provider ID for the vector database.\n        embedding_params: Optional\
          \ embedding parameters.\n        distance_metric: Vector distance metric\
          \ (e.g. \"cosine\").\n        chunking_method: Chunking method.\n      \
          \  chunk_size: Chunk size in characters.\n        chunk_overlap: Chunk overlap\
          \ in characters.\n        batch_size: Number of documents per batch; 0 means\
          \ process all in one batch.\n        collection_name: Optional name of the\
          \ collection to reuse; omit to create a new one.\n        indexing_stats:\
          \ Output artifact directory containing vector_store_stats.json and\n   \
          \         indexing_run_metadata.json.\n        pattern_name: Optional RAG\
          \ pattern identifier for run metadata.\n        vector_store_type: Optional\
          \ vector store provider type (e.g. milvus) for statistics.\n    \"\"\"\n\
          \    import json\n    import logging\n    import os\n    import ssl\n  \
          \  import sys\n    import time\n    from datetime import datetime, timezone\n\
          \    from pathlib import Path\n\n    import httpx\n    from ai4rag.rag.chunking\
          \ import LangChainChunker\n    from ai4rag.rag.embedding.ogx import OGXEmbeddingModel,\
          \ OGXEmbeddingParams\n    from ai4rag.rag.vector_store.ogx import OGXVectorStore\n\
          \    from langchain_core.documents import Document\n    from ogx_client\
          \ import APIConnectionError as OGXAPIConnectionError\n    from ogx_client\
          \ import OgxClient\n\n    def _is_ssl_error(exc: BaseException) -> bool:\n\
          \        \"\"\"Check whether an exception (or its cause/context chain) is\
          \ an SSL verification failure.\"\"\"\n        seen = set()\n        current:\
          \ BaseException | None = exc\n        while current is not None and id(current)\
          \ not in seen:\n            seen.add(id(current))\n            msg = str(current).upper()\n\
          \            if \"CERTIFICATE_VERIFY_FAILED\" in msg or \"SSL\" in msg:\n\
          \                return True\n            current = current.__cause__ or\
          \ current.__context__\n        return False\n\n    def _create_ogx_client(**kwargs)\
          \ -> OgxClient:\n        \"\"\"Create OgxClient, falling back to SSL-unverified\
          \ if self-signed cert detected.\"\"\"\n        client = OgxClient(**kwargs)\n\
          \        try:\n            client.models.list()\n        except (ssl.SSLCertVerificationError,\
          \ httpx.ConnectError, OGXAPIConnectionError) as exc:\n            if _is_ssl_error(exc):\n\
          \                logger.warning(\n                    \"SSL verification\
          \ failed for OgxClient \u2014 retrying with verify=False. \",\n        \
          \        )\n                client = OgxClient(\n                    **kwargs,\n\
          \                    http_client=httpx.Client(verify=False),\n         \
          \       )\n            else:\n                raise\n        return client\n\
          \n    logger = logging.getLogger(\"Document Loader component logger\")\n\
          \    logger.setLevel(logging.INFO)\n    handler = logging.StreamHandler(sys.stdout)\n\
          \    logger.addHandler(handler)\n\n    supported_distance_metrics = (\"\
          cosine\", \"euclidean\")\n    supported_chunking_methods = (\"recursive\"\
          ,)\n    supported_chunks_sizes_range = (128, 2048)\n\n    if not vector_io_provider_id\
          \ or not vector_io_provider_id.strip():\n        raise ValueError(\"vector_io_provider_id\
          \ must be a non-empty string.\")\n\n    if not embedding_model_id:\n   \
          \     raise ValueError(\"embedding_model_id must be a non-empty string.\"\
          )\n\n    if distance_metric not in supported_distance_metrics:\n       \
          \ raise ValueError(\n            f\"distance metric {distance_metric} is\
          \ not supported, supported types are {supported_distance_metrics}.\"\n \
          \       )\n\n    if chunking_method not in supported_chunking_methods:\n\
          \        raise ValueError(f\"chunking_method is not supported, supported\
          \ methods are {supported_chunking_methods}.\")\n\n    if not isinstance(chunk_size,\
          \ int):\n        raise TypeError(\"chunk_size must be an integer.\")\n \
          \   else:\n        if not (supported_chunks_sizes_range[0] <= chunk_size\
          \ <= supported_chunks_sizes_range[1]):\n            raise ValueError(\n\
          \                f\"chunk_size must be an integer in the range\"\n     \
          \           f\" {supported_chunks_sizes_range[0]} to {supported_chunks_sizes_range[1]}.\"\
          \n            )\n\n    if not isinstance(chunk_overlap, (int, float)):\n\
          \        raise TypeError(\"chunk_overlap must be a numerical value.\")\n\
          \n    if embedding_params is None:\n        embedding_params = {}\n    else:\n\
          \        if not isinstance(embedding_params, dict):\n            raise TypeError(\"\
          embedding_params must be a dictionary.\")\n\n    params = OGXEmbeddingParams(**embedding_params)\n\
          \n    ogx_base_url = os.getenv(\"OGX_CLIENT_BASE_URL\")\n    ogx_api_key\
          \ = os.getenv(\"OGX_CLIENT_API_KEY\")\n    missing = [\n        name for\
          \ name, val in ((\"OGX_CLIENT_BASE_URL\", ogx_base_url), (\"OGX_CLIENT_API_KEY\"\
          , ogx_api_key)) if not val\n    ]\n    if missing:\n        raise RuntimeError(f\"\
          Required environment variable(s) not set: {', '.join(missing)}\")\n\n  \
          \  def _write_indexing_artifacts(\n        *,\n        indexing_stats_path:\
          \ Path,\n        started_at: datetime,\n        duration_seconds: float,\n\
          \        pattern_name: str | None,\n        vector_store_type: str | None,\n\
          \        collection_name: str | None,\n        vector_io_provider_id: str,\n\
          \        embedding_model_id: str,\n        embedding_params: dict,\n   \
          \     distance_metric: str,\n        document_count: int,\n        chunk_count:\
          \ int,\n    ) -> None:\n        indexing_stats_path.mkdir(parents=True,\
          \ exist_ok=True)\n        completed_at = datetime.now(timezone.utc)\n  \
          \      embedding_dimension = (\n            embedding_params.get(\"embedding_dimension\"\
          ) if isinstance(embedding_params, dict) else None\n        )\n\n       \
          \ vector_store_stats = {\n            \"collection_name\": collection_name,\n\
          \            \"vector_store_type\": vector_store_type or vector_io_provider_id,\n\
          \            \"document_count\": document_count,\n            \"chunk_count\"\
          : chunk_count,\n            \"embedding_model\": embedding_model_id,\n \
          \           \"embedding_dimension\": embedding_dimension,\n            \"\
          distance_metric\": distance_metric,\n            \"indexing_duration_seconds\"\
          : round(duration_seconds, 3),\n            \"created_at\": completed_at.isoformat().replace(\"\
          +00:00\", \"Z\"),\n            \"pattern_id\": pattern_name,\n        }\n\
          \        run_metadata = {\n            \"pattern_id\": pattern_name,\n \
          \           \"started_at\": started_at.isoformat().replace(\"+00:00\", \"\
          Z\"),\n            \"completed_at\": completed_at.isoformat().replace(\"\
          +00:00\", \"Z\"),\n            \"duration_seconds\": round(duration_seconds,\
          \ 3),\n            \"document_count\": document_count,\n            \"chunk_count\"\
          : chunk_count,\n            \"embedding_model_id\": embedding_model_id,\n\
          \            \"vector_io_provider_id\": vector_io_provider_id,\n       \
