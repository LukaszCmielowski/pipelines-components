          ):\n            if not descriptor_path.exists():\n                raise\
          \ FileNotFoundError(f\"documents_descriptor.json not found at {descriptor_path}\"\
          )\n\n            s3_creds = {k: os.environ.get(k) for k in [\"AWS_ACCESS_KEY_ID\"\
          , \"AWS_SECRET_ACCESS_KEY\", \"AWS_S3_ENDPOINT\"]}\n            for k, v\
          \ in s3_creds.items():\n                if v is None:\n                \
          \    raise ValueError(\n                        f\"{k} environment variable\
          \ not set. Check if kubernetes secret was configured properly.\"\n     \
          \               )\n            s3_creds[\"AWS_DEFAULT_REGION\"] = os.environ.get(\"\
          AWS_DEFAULT_REGION\")\n\n            logger = logging.getLogger(\"Text Extraction\
          \ component logger\")\n            logger.setLevel(logging.INFO)\n     \
          \       logger.propagate = False\n            if not logger.handlers:\n\
          \                handler = logging.StreamHandler(sys.stdout)\n         \
          \       logger.addHandler(handler)\n\n            output_dir = Path(extracted_text.path)\n\
          \            output_dir.mkdir(parents=True, exist_ok=True)\n\n         \
          \   with open(descriptor_path) as f:\n                descriptor = json.load(f)\n\
          \            bucket = descriptor[\"bucket\"]\n            documents = descriptor[\"\
          documents\"]\n\n            if not documents:\n                logger.info(\"\
          No documents to process.\")\n                return\n\n            documents\
          \ = sorted(documents, key=lambda d: d.get(\"size_bytes\", 0), reverse=True)\n\
          \n            if max_extraction_workers is not None:\n                effective_workers\
          \ = max(1, max_extraction_workers)\n            else:\n                effective_workers\
          \ = min(max(1, (os.cpu_count() or 1) // 2), 8)\n            logger.info(\n\
          \                \"Starting text extraction for %d documents. extraction_workers=%d,\
          \ download_threads=%d.\",\n                len(documents),\n           \
          \     effective_workers,\n                DOWNLOAD_MAX_THREADS,\n      \
          \      )\n\n            if _docling_artifacts_path() is not None:\n    \
          \            os.environ.setdefault(\"HF_HUB_OFFLINE\", \"1\")\n\n      \
          \      multiprocessing_context = multiprocessing.get_context(\"spawn\")\n\
          \            with (\n                tempfile.TemporaryDirectory() as download_dir,\n\
          \                multiprocessing_context.Pool(\n                    processes=effective_workers,\n\
          \                    initializer=_text_extraction_pool_initializer,\n  \
          \              ) as process_pool,\n            ):\n                download_start_time\
          \ = time.perf_counter()\n                extraction_tasks, download_error_details\
          \ = download_and_submit(\n                    documents, Path(download_dir),\
          \ process_pool, output_dir\n                )\n                logger.info(\n\
          \                    \"Downloads finished in %.1fs; %d file(s) queued for\
          \ extraction, %d download error(s).\",\n                    time.perf_counter()\
          \ - download_start_time,\n                    len(extraction_tasks),\n \
          \                   len(download_error_details),\n                )\n  \
          \              raise_if_threshold_exceeded(download_error_details, len(documents),\
          \ error_tolerance)\n\n                extraction_error_details = []\n  \
          \              processed_count = 0\n                pending = list(extraction_tasks)\n\
          \                completed = 0\n                while pending:\n       \
          \             still_pending = []\n                    for file_path, task\
          \ in pending:\n                        if task.ready():\n              \
          \              completed += 1\n                            try:\n      \
          \                          success, tb = task.get()\n                  \
          \          except Exception:\n                                tb = traceback.format_exc()\n\
          \                                logger.error(\"Worker crashed for %s:\\\
          n%s\", file_path, tb)\n                                success = False\n\
          \                            Path(file_path).unlink(missing_ok=True)\n \
          \                           if success:\n                              \
          \  processed_count += 1\n                            else:\n           \
          \                     extraction_error_details.append({\"file\": file_path,\
          \ \"traceback\": tb})\n                            logger.info(\"Extraction\
          \ progress %d/%d\", completed, len(extraction_tasks))\n                \
          \        else:\n                            still_pending.append((file_path,\
          \ task))\n                    pending = still_pending\n                \
          \    if pending:\n                        time.sleep(0.01)\n\n         \
          \   all_error_details = download_error_details + extraction_error_details\n\
          \            total_errors = len(all_error_details)\n            total_docs\
          \ = len(documents)\n            logger.info(\n                \"Text extraction\
          \ completed. Total processed: %d/%d, Errors: %d\",\n                processed_count,\n\
          \                total_docs,\n                total_errors,\n          \
          \  )\n            raise_if_threshold_exceeded(all_error_details, total_docs,\
          \ error_tolerance)\n\n"
        image: quay.io/opendatahub/odh-autorag:odh-stable
pipelineInfo:
  description: AutoRAG pipeline for preparing a high-quality knowledge base for accurate
    RAG retrieval. It transforms unstructured documents into optimized vector indexes
    for semantic search and downstream RAG workflows. Delivers production-grade embeddings,
    flexible indexing controls, and a reliable foundation for scalable RAG applications.
  name: autorag-documents-indexing-pipeline
root:
  dag:
    tasks:
      documents-discovery:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-documents-discovery
        inputs:
          parameters:
            input_data_bucket_name:
              componentInputParameter: input_data_bucket_name
            input_data_path:
              componentInputParameter: input_data_key
            sampling_enabled:
              runtimeValue:
                constant: false
        taskInfo:
          name: documents-discovery
      documents-indexing:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-documents-indexing
        dependentTasks:
        - text-extraction
        inputs:
          artifacts:
            extracted_text:
              taskOutputArtifact:
                outputArtifactKey: extracted_text
                producerTask: text-extraction
          parameters:
            batch_size:
              componentInputParameter: batch_size
            chunk_overlap:
              componentInputParameter: chunk_overlap
            chunk_size:
              componentInputParameter: chunk_size
            chunking_method:
              componentInputParameter: chunking_method
            collection_name:
              componentInputParameter: collection_name
            distance_metric:
              componentInputParameter: distance_metric
            embedding_model_id:
              componentInputParameter: embedding_model_id
            embedding_params:
              componentInputParameter: embedding_params
            pattern_name:
              componentInputParameter: pattern_name
            vector_io_provider_id:
              componentInputParameter: vector_io_provider_id
            vector_store_type:
              componentInputParameter: vector_store_type
        taskInfo:
          name: documents-indexing
      text-extraction:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-text-extraction
        dependentTasks:
        - documents-discovery
        inputs:
          artifacts:
            documents_descriptor:
              taskOutputArtifact:
                outputArtifactKey: discovered_documents
                producerTask: documents-discovery
        taskInfo:
          name: text-extraction
  inputDefinitions:
    parameters:
      batch_size:
        defaultValue: 20.0
        description: Number of documents per batch (0 = process all at once).
        isOptional: true
        parameterType: NUMBER_INTEGER
      chunk_overlap:
        defaultValue: 0.0
        description: Chunk overlap in characters.
        isOptional: true
        parameterType: NUMBER_INTEGER
      chunk_size:
        defaultValue: 1024.0
        description: Chunk size in characters.
        isOptional: true
        parameterType: NUMBER_INTEGER
      chunking_method:
        defaultValue: recursive
        description: Chunking method (e.g. "recursive").
        isOptional: true
        parameterType: STRING
      collection_name:
        description: Optional name of the collection to reuse; omit to create a new
          one.
        isOptional: true
        parameterType: STRING
      distance_metric:
        defaultValue: cosine
        description: Vector distance metric (e.g. "cosine").
        isOptional: true
        parameterType: STRING
      embedding_model_id:
        description: Embedding model ID for the vector store.
        parameterType: STRING
      embedding_params:
        description: 'Dict passed to OGXEmbeddingParams (default: {}).'
        isOptional: true
        parameterType: STRUCT
      input_data_bucket_name:
        description: Name of the S3 bucket containing input data.
        parameterType: STRING
      input_data_key:
        description: Path to folder with input documents within bucket.
        isOptional: true
        parameterType: STRING
      input_data_secret_name:
        description: 'Name of the secret with S3 credentials for input data

          ("AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_S3_ENDPOINT", "AWS_DEFAULT_REGION").'
        parameterType: STRING
      ogx_secret_name:
        description: 'Name of the secret with OGX credentials

          ("OGX_CLIENT_BASE_URL", "OGX_CLIENT_API_KEY").'
        parameterType: STRING
      pattern_name:
        description: Optional RAG pattern name for indexing run metadata.
        isOptional: true
        parameterType: STRING
      vector_io_provider_id:
        description: Optional OGX provider ID.
        parameterType: STRING
      vector_store_type:
        description: Optional vector store provider type for indexing statistics.
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-documents-discovery:
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            - envVar: AWS_S3_ENDPOINT
              secretKey: AWS_S3_ENDPOINT
            - envVar: AWS_DEFAULT_REGION
              secretKey: AWS_DEFAULT_REGION
            optional: false
            secretNameParameter:
              componentInputParameter: input_data_secret_name
        exec-documents-indexing:
          secretAsEnv:
          - keyToEnv:
            - envVar: OGX_CLIENT_BASE_URL
              secretKey: OGX_CLIENT_BASE_URL
            - envVar: OGX_CLIENT_API_KEY
              secretKey: OGX_CLIENT_API_KEY
            optional: false
            secretNameParameter:
              componentInputParameter: ogx_secret_name
        exec-text-extraction:
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            - envVar: AWS_S3_ENDPOINT
              secretKey: AWS_S3_ENDPOINT
            - envVar: AWS_DEFAULT_REGION
              secretKey: AWS_DEFAULT_REGION
            optional: false
            secretNameParameter:
              componentInputParameter: input_data_secret_name
